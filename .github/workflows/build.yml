name: Build and Test
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

      - name: Run PIT mutation coverage
        run: mvn -q org.pitest:pitest-maven:mutationCoverage

      - name: Extract current mutation score
        id: pit
        run: |
          SCORE_CURRENT=$(grep -oP 'Killed \d+ \(\K\d+(?=%\))' target/pit-reports/*/index.html)
          echo "SCORE_CURRENT=$SCORE_CURRENT" >> $GITHUB_ENV
          echo "Current mutation score: $SCORE_CURRENT%"

      - name: Compare mutation score with baseline
        run: |
          SCORE_BASELINE=$(cat .pit-score)
          echo "Baseline score  : $SCORE_BASELINE%"
          echo "Current score   : $SCORE_CURRENT%"
          if [ "$SCORE_CURRENT" -lt "$SCORE_BASELINE" ]; then
            echo "Le score de mutation a diminué ! Build failed."
            exit 1
          else
            echo "Mutation score OK (no regression)."
          fi
